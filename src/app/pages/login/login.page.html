<ion-content [fullscreen]="true" class="login-content ion-padding">
  <div class="login-wrapper">
    <div class="logo-container ion-text-center">
      <img
        src="assets/images/logo.png"
        alt="Logo Estética Unisex Kenya"
        class="logo-img"
      />
      <h1 class="brand-title">Estética Unisex Kenya</h1>
      <p class="brand-subtitle">Inicio de sesión</p>
    </div>

    <ion-card class="login-card">
      <ion-card-content>
        <ion-item class="custom-item" lines="none">
          <ion-icon name="person-outline" slot="start" color="primary"></ion-icon>
          <ion-input
            type="text"
            placeholder="Usuario o Correo Electrónico"
            [(ngModel)]="usuarioOEmail"
          ></ion-input>
        </ion-item>
        @if (errorUsuario) {
          <ion-text color="danger">
            <p class="error-msg">{{ errorUsuario }}</p>
          </ion-text>
        }

        <ion-item class="custom-item" lines="none">
          <ion-icon name="lock-closed-outline" slot="start" color="primary"></ion-icon>
          <ion-input
            [type]="mostrarContrasena ? 'text' : 'password'"
            placeholder="Contraseña"
            [(ngModel)]="contrasena"
          ></ion-input>
          <ion-button fill="clear" slot="end" (click)="alternarContrasena()">
            <ion-icon
              slot="icon-only"
              [name]="mostrarContrasena ? 'eye-off-outline' : 'eye-outline'"
            ></ion-icon>
          </ion-button>
        </ion-item>
        @if (errorContrasena) {
          <ion-text color="danger">
            <p class="error-msg">{{ errorContrasena }}</p>
          </ion-text>
        }

        <ion-button
          expand="block"
          shape="round"
          class="ion-margin-top"
          (click)="iniciarSesion()"
        >
          Iniciar sesión
        </ion-button>

        <ion-button
          expand="block"
          fill="clear"
          size="small"
          (click)="recuperarContrasena()"
        >
          ¿Olvidaste tu contraseña?
        </ion-button>

        <div class="wf-divider">¿No tienes una cuenta?</div>

        <ion-button
          expand="block"
          fill="outline"
          shape="round"
          color="primary"
          routerLink="/registro"
        >
          Crear una cuenta
        </ion-button>
      </ion-card-content>
    </ion-card>
  </div>
</ion-content>
